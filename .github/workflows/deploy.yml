name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Before anything runs Astro: its CLI runs on Node, and the runner's
      # preinstalled Node can be older than Astro supports.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The playground crate compiles to wasm during `bun run build`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: playground
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: bun install --frozen-lockfile
      - name: Playground interpreter tests
        run: cargo test --manifest-path playground/Cargo.toml
      - run: bun run build
      - name: Typecheck
        run: bun run check
      - name: Check internal links
        run: node tools/check-links.mjs dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
