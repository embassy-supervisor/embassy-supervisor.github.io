<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#bg)" stroke="#22d3ee" stroke-width="2.2"/>
  <!-- lifecycle orbit: respawn cycle -->
  <circle cx="32" cy="24" r="13" fill="none" stroke="#26304d" stroke-width="1.4" stroke-dasharray="3 4"/>
  <!-- supervisor node -->
  <circle cx="32" cy="24" r="5.5" fill="#22d3ee"/>
  <!-- task nodes on the orbit -->
  <circle cx="45" cy="24" r="4" fill="#a78bfa"/>
  <circle cx="24.8" cy="35" r="4" fill="#fb7185"/>
  <!-- heartbeat trace: liveness -->
  <path d="M9 47 H19.5 L23.5 40.5 L27.5 52.5 L31.5 44.5 L35.5 48.5 H55" fill="none" stroke="#a3e635" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
