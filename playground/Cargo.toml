[package]
name = "embassy-supervisor-playground"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "In-browser playground for embassy-supervisor: real runtime + real DSL parser compiled to wasm"

# Detached from any parent workspace on purpose: this crate targets
# wasm32-unknown-unknown while the site repo has no Rust workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
embassy-supervisor = { version = "0.10.0", features = [
    "macros",
    "control",
    "pool",
    "restart",
    "bound-deps",
    "readiness",
    "liveness",
    "liveness-monitor",
    "epochs",
    "node-status",
    "coupling",
    "coupling-observe",
    "dataflow",
    "data-deps",
    "graph-ref",
    "trace",
    "log",
    "budget",
    "veto",
    "fault-inject",
] }
embassy-supervisor-syntax = "=0.4.0"
embassy-supervisor-tools = { version = "=0.5.0", default-features = false }
embassy-time = { version = "0.5", features = ["mock-driver"] }
embassy-futures = "0.1"
embassy-sync = "0.8"

# The browser main thread is the only thread; std's Mutex-based
# critical-section impl is the same shim the crate's host tests use.
critical-section = { version = "1", features = ["std"] }

# Same syn major as embassy-supervisor-syntax 0.4.0 (syn 3).
syn = { version = "3", default-features = false, features = ["parsing", "printing"] }
quote = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# The executor platform is a feature, not a target cfg, so it must be picked
# per target: the page runs platform-wasm; the native test harness (the CI
# guard for the whole interpreter) runs platform-std.
[target.'cfg(target_arch = "wasm32")'.dependencies]
embassy-executor = { version = "0.10", features = ["platform-wasm", "executor-thread"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
